name: SonarQube Cloud C# security

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.401
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify project access and select CI analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python .github/sonar/report.py preflight
      - name: Install pinned SonarScanner for .NET
        run: |
          dotnet tool install dotnet-sonarscanner --version 12.0.0 --tool-path "$env:RUNNER_TEMP/sonar-scanner"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Restore solution and frontend build dependencies
        run: |
          dotnet restore LANCommander.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd ci --prefix LANCommander.UI
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd ci --prefix LANCommander.Server
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Begin C# analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & "$env:RUNNER_TEMP/sonar-scanner/dotnet-sonarscanner" begin /k:dbalikhin_LANCommander /o:dbalikhin /d:sonar.host.url=https://sonarcloud.io /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.scanner.scanAll=false /d:sonar.sca.enabled=false /d:sonar.inclusions="**/*.cs,**/*.cshtml,**/*.razor" /d:sonar.exclusions="**/*.js,**/*.jsx,**/*.ts,**/*.tsx,**/*.css,**/*.scss,**/*.html,**/*.c,**/*.cpp,**/*.h,**/*.ps1,**/*.sh,**/*.yml,**/*.yaml,**/node_modules/**,**/bin/**,**/obj/**"
          $scanExit = $LASTEXITCODE
          @{ begin_seconds = $timer.Elapsed.TotalSeconds } | ConvertTo-Json | Set-Content sonar-artifacts/timing-begin.json
          exit $scanExit
      - name: Build full solution with Sonar C# analyzers
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          dotnet build LANCommander.slnx --no-restore --no-incremental --configuration Release -m:2 -p:UseSharedCompilation=false -v:minimal 2>&1 | Tee-Object sonar-artifacts/build.log
          $buildExit = $LASTEXITCODE
          @{ build_with_analysis_seconds = $timer.Elapsed.TotalSeconds; build_exit_code = $buildExit } | ConvertTo-Json | Set-Content sonar-artifacts/timing-build.json
          exit $buildExit
      - name: Submit analysis to SonarQube Cloud
        id: submit
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          $timer = [Diagnostics.Stopwatch]::StartNew()
          & "$env:RUNNER_TEMP/sonar-scanner/dotnet-sonarscanner" end /d:sonar.token="$env:SONAR_TOKEN"
          $scanExit = $LASTEXITCODE
          @{ end_and_upload_seconds = $timer.Elapsed.TotalSeconds; scanner_exit_code = $scanExit } | ConvertTo-Json | Set-Content sonar-artifacts/timing-end.json
          exit $scanExit
      - name: Wait for server processing and export security findings
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python .github/sonar/report.py collect
      - name: Retain security reports and timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-csharp-security
          path: sonar-artifacts/
          if-no-files-found: warn
          retention-days: 14
