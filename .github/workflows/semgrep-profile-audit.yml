name: Semgrep Pro C# security profile audit
on:
  push:
    branches: [semgrep-rule-profile-audit]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  profile:
    name: csharp / pro / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        profile: [csharp, default, owasp-top-ten, policy]
    env:
      PROFILE: ${{ matrix.profile }}
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      SEMGREP_REPO_NAME: ${{ github.repository }}
      SEMGREP_SEND_METRICS: 'off'
      SEMGREP_ENABLE_VERSION_CHECK: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned Semgrep and Pro engine
        run: |
          python -m pip install --disable-pip-version-check 'semgrep==1.181.0' 'PyYAML==6.0.3'
          semgrep install-semgrep-pro
      - name: Audit available rules and scan C# security only
        run: python .github/grep/profile-audit.py
      - name: Preserve rule inventory and scan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pro-profile-${{ matrix.profile }}
          path: |
            profile-results/
            profile-evidence/
          retention-days: 90
          if-no-files-found: error
