name: Dotnetarium security scan

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  scan:
    name: C# security / default no-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the complete solution and upload to GitHub code scanning
        id: dotnetarium
        uses: dotnetarium/dotnetarium-action@de145b7ae5b4bea1cca0edef7eb184fed486ed56
        with:
          target: LANCommander.slnx
          version: '2.7.1'
          framework: net10.0
          configuration: Debug
          sarif-file: dotnetarium.sarif
          upload-sarif: 'true'
          category: dotnetarium-csharp
      - name: Retain the SARIF report
        if: ${{ !cancelled() && steps.dotnetarium.outputs.sarif-file != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dotnetarium-sarif
          path: dotnetarium.sarif
          if-no-files-found: warn
          retention-days: 14
