name: Semgrep Pro policy plus public C# security rules
on:
  push:
    branches: [pro-public-union]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    name: Pro policy plus expanded public rules
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ENGINE: semgrep-pro
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      SEMGREP_REPO_NAME: ${{ github.repository }}
      SEMGREP_ENABLE_VERSION_CHECK: '0'
      SEMGREP_SEND_METRICS: 'off'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare union of Pro policy and public C# security rules
        run: |
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
          python .github/grep/expanded-benchmark.py prepare
      - name: Scan once for coverage comparison
        run: python .github/grep/expanded-benchmark.py scan
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expanded-csharp-semgrep-pro
          path: |
            results/
            evidence/
          retention-days: 90
          if-no-files-found: error
